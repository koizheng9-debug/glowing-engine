services:
  - type: web
    name: todoboard
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: todoboard-db
          property: connectionString

databases:
  - name: todoboard-db
    plan: free
